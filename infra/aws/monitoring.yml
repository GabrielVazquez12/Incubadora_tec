AWSTemplateFormatVersion: '2010-09-09'
Description: Operational alarms and an account-wide monthly cost budget for Incubadora.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    why: notify the chosen operator about availability, server errors, database space and account spend
    must: [Provide user-approved recipient and monthly amount before deployment, No automated shutdown actions]
Parameters:
  NotificationEmail:
    Type: String
    AllowedPattern: '[^\s@]+@[^\s@]+\.[^\s@]+'
  MonthlyBudgetUsd:
    Type: Number
    MinValue: 1
    Description: Account-wide monthly cost warning threshold, not a hard spending cap.
  DatabaseIdentifier:
    Type: String
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9-]*'
  LoadBalancerFullName:
    Type: String
    AllowedPattern: 'app/.+/.+'
  TargetGroupFullName:
    Type: String
    AllowedPattern: 'targetgroup/.+/.+'
Resources:
  AlertKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypt operational notifications published by CloudWatch
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: 'kms:*'
            Resource: '*'
          - Sid: CloudWatchEncryption
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: ['kms:GenerateDataKey*', 'kms:Decrypt']
            Resource: '*'
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*'}
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: !GetAtt AlertKey.Arn
  AlertPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref Alerts]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref Alerts
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*'}
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref Alerts
  NoHealthyTargets:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-no-healthy-targets'
      AlarmDescription: No healthy portal container for three minutes; check ECS tasks and logs.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !Ref LoadBalancerFullName}
        - {Name: TargetGroup, Value: !Ref TargetGroupFullName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref Alerts]
      OKActions: [!Ref Alerts]
  ServerErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-server-errors'
      AlarmDescription: At least five backend HTTP 5xx responses in five minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !Ref LoadBalancerFullName}
        - {Name: TargetGroup, Value: !Ref TargetGroupFullName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
      OKActions: [!Ref Alerts]
  DatabaseSpace:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-database-space'
      AlarmDescription: RDS free storage below 2 GiB for three minutes.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref DatabaseIdentifier}
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref Alerts]
      OKActions: [!Ref Alerts]
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Metadata:
      com.aws.cloudformation.Context:
        why: account-wide visibility includes legacy resources and credits consumption
        must: [Do not imply the threshold stops spending, Exclude credits and refunds to show gross service usage]
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-account-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref NotificationEmail}]
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref NotificationEmail}]
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref NotificationEmail}]
Outputs:
  AlertTopicArn:
    Value: !Ref Alerts
  SubscriptionNote:
    Value: Confirm the SNS subscription email before operational notifications can be delivered.
